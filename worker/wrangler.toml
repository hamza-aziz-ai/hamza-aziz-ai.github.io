name = "hamzaaziz-chat"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Comma-separated. Only these origins get CORS headers and are served.
ALLOWED_ORIGINS = "https://hamzaaziz.dev"
# Primary model. Configurable because Google retires model versions.
MODEL = "gemini-2.5-flash-lite"
# Workers AI fallback. Confirm the id exists in your account's catalog
# (dashboard > AI > Models) before deploying; pick a free @cf/ model, not a
# third-party partner model, which is billed separately.
FALLBACK_MODEL = "@cf/meta/llama-3.1-8b-instruct"

# Workers AI binding for the fallback. No key needed.
[ai]
binding = "AI"

# Per-visitor limit: 10 messages a minute per IP. Stops one scraper from
# draining the free daily quota for everyone else.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# GEMINI_API_KEY is a secret, never in this file:
#   npx wrangler secret put GEMINI_API_KEY
