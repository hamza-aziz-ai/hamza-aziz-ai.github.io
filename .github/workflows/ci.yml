# Every pull request into main runs the site checks and the chat worker's
# self-checks. When all of them pass, the merge job merges the PR itself:
# changes reach main only through this gate, never by a hand merge.
# The repo's plan has no branch protection, so GitHub's native auto-merge has
# no required checks to wait for; the merge job's `needs` is the gate instead.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A new push to the PR cancels the run for the old head.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: HTML balances on every page
        run: python -I .github/scripts/html_balance.py *.html projects/*.html

      # Checked against the staged copy deploy.yml publishes, so a page that
      # links a file left out of the allowlist fails here.
      - name: Every local file a page references is published
        run: |
          sh .github/scripts/stage_site.sh
          cd _site && python -I ../.github/scripts/assets_check.py *.html projects/*.html hamza-aziz-resume/index.html matrimony/index.html

      - name: JavaScript parses
        run: for f in assets/js/*.js; do node --check "$f"; done

      - name: Sitemap entries resolve
        run: python -I .github/scripts/sitemap_check.py

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Chat worker self-checks
        run: |
          pip install --quiet pypdf==6.21.1   # test_results_only imports the knowledge builder
          node worker/test.mjs
          python -I worker/test_results_only.py

  merge:
    needs: [site, worker]
    # Only branches of this repo, and not drafts: a draft is a way to park work.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write        # merge into main
      pull-requests: write   # merge and delete the branch
      actions: write         # start the push-to-main workflows below
      issues: write          # report a failed merge
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      # --match-head-commit refuses to merge if the branch moved after the
      # commit these checks ran on.
      - name: Merge the PR
        id: merge
        run: gh pr merge "$PR" --repo "$REPO" --rebase --delete-branch --match-head-commit "${{ github.event.pull_request.head.sha }}"

      # A merge made with GITHUB_TOKEN raises no push event, so nothing that
      # normally runs on a push to main starts by itself. Start it here.
      - name: Start the push-to-main workflows
        run: |
          gh workflow run deploy.yml --repo "$REPO" --ref main
          if gh pr diff "$PR" --repo "$REPO" --name-only \
              | grep -qE '^(worker/|index\.html$|projects/|assets/pdf/|sitemap\.xml$|\.github/workflows/worker\.yml$)'; then
            gh workflow run worker.yml --repo "$REPO" --ref main
          fi

      # Nothing retries a merge that fails (in practice a conflict with main),
      # so make it loud: a PR comment and an issue, which GitHub emails out.
      - name: Report a failed merge
        if: failure() && steps.merge.outcome == 'failure'
        run: |
          msg="The checks passed but the automatic merge of #$PR failed, usually because main changed and the rebase conflicts. Rebase the branch on main and push; that reruns CI. Run: $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          gh pr comment "$PR" --repo "$REPO" --body "$msg"
          gh issue create --repo "$REPO" --title "Automatic merge failed: PR #$PR" --body "$msg"
