# Answer checks against the live chat assistant (D-023): the questions in
# worker/evals/cases.mjs, their required facts, reply time and which backend
# answered. Runs weekly, by hand, and when worker.yml starts it after a
# deploy that changed the Worker. Not after every site deploy: each run asks
# 15+ questions of the free model allowances (D-024). A failing run opens an
# issue, which GitHub emails.
name: Chat answer checks

on:
  schedule:
    - cron: "0 4 * * 1"   # Mondays, after the weekly knowledge rebuild at 03:30
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-evals
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ask the live assistant
        run: node worker/evals/run.mjs

      - name: Open an issue for a failed run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Chat answer checks failed" \
            --body "The live assistant failed an answer check. Results: $GITHUB_SERVER_URL/${{ github.repository }}/actions/runs/$GITHUB_RUN_ID"
