# Deploy the chat assistant's Cloudflare Worker whenever the code or the pages
# it answers from change. The knowledge text is rebuilt from the pages first,
# so a site edit reaches the chat without a manual step. Private notes are not
# involved: they live in Workers KV (worker/upload_notes.py), never in git.
name: Chat Worker deploy

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "index.html"
      - "projects/**"
      - "assets/pdf/**"
      - "sitemap.xml"
      - ".github/workflows/worker.yml"
  # The CV page lives in the hamza-aziz-cv repo and is fetched live, so a
  # weekly rebuild picks up CV edits.
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write   # start the answer checks after a Worker change
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # the last commit's diff decides whether to check answers

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build knowledge from the site
        run: |
          pip install --quiet pypdf==6.21.1   # reads the CV PDF
          python -I worker/build_knowledge.py

      - name: Self-check
        run: |
          node worker/test.mjs
          python -I worker/test_results_only.py

      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.151.2 deploy

      # The answer checks ask the live assistant 15+ questions, so they run
      # only when the deployed commit changed the Worker, its model settings
      # or the checks themselves (D-023). Started here because a run that CI
      # started with GITHUB_TOKEN never fires a workflow_run trigger.
      - name: Start the answer checks after a Worker change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(worker/src/index\.js|worker/wrangler\.toml|worker/evals/)'; then
            gh workflow run evals.yml --repo "${{ github.repository }}" --ref main
          else
            echo "Last commit did not change the Worker; answer checks not started."
          fi
